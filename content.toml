desc  = "Brains & Bytes, a zombie-apocalypse-themed CTF, 18 challenges across six categories. We finished 10th out of 955 teams from 94 countries, playing alongside people from the national team who had landed at the same university as me. It came with HTB swag and vouchers, and an interview on live television that I was not dressed for."
link = "https://www.hackthebox.com/blog/HTB-university-CTF-2023-recap"
link_label = "HackTheBox's recap"

[[security.record.steps]]
step  = "Jan 2024"
title = "US Cyber Games New Year Mayhem, 2nd"
desc  = "Second place at HackTheBox's New Year Mayhem, run with the US Cyber Games, playing as ECSC Team Greece."
