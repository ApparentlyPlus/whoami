[[security.record.steps]]
step  = "2024"
title = "Qualifiers again, 6th"
desc  = "I went back with no training at all, purely for the love of the game, and placed 6th. Then I handed my spot to a friend I had been playing with since PMDK. He was a year younger and in it for blood, and it was his turn."

[security.now]
title = "Where it is now"

paras = [
"""
Competing well takes hours I stopped having. Finishing a degree a year early
and writing a kernel for the thesis took most of them, and this is not a thing
you can do halfway, so I stepped back rather than keep showing up
underprepared.
""",
"""
The instinct stayed, and in 2025 it found something. An authorization flaw in
Unistudents, a university dashboard app with more than 100k downloads, sitting
in a path that could have cost its sponsors real money. I reported it to the
vendor, worked the fix through with them, and filed with MITRE. The CVE is
approved and waiting on publication, which is the only reason there is no
writeup on this page yet.
""",
"""
The OSCP and the rest of the OffSec track are what I want next, and the honest
answer on timing is that it depends on where I land, because I would rather
work through them alongside a job than in the gap before one. None of it is
sitting idle in the meantime. Reading your own code for what you assumed rather
than for what you wrote is the same skill pointed inward, and it is most of
what I mean when I say I ship secure software.
""",
]

