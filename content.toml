# Pawstack Case Study (/pawstack)

[pawstack]
page_title = "PawStack"
eyebrow = "Undergraduate thesis · University of Macedonia"
title   = "PawStack"
tagline = "A toolchain where your program <em>is</em> the operating system."
lede = """
Most operating systems are built to run any program. PawStack inverts that:
you write one program, and the toolchain builds the smallest operating system
that can run it. The compiler reads your code, works out which kernel
subsystems it actually touches, and emits a bootable image containing only
those.
"""

[[pawstack.stats]]
label = "Kernel"
value = "x86_64"

[[pawstack.stats]]
label = "Stdlib modules"
value = "24"

[[pawstack.stats]]
label = "Written"
value = "Solo"

[[pawstack.stats]]
label = "Status"
value = "Feature complete"

[pawstack.idea]
title = "The idea"
body = """
A general-purpose kernel pays for everything it might need. A heap allocator
ships whether or not you allocate, and a scheduler ships whether or not you
ever spawn a thread. For a general OS that is the right trade. For an
appliance that runs exactly one program forever, it is pure overhead, and it
is overhead you cannot remove without becoming a kernel engineer.
"""
body_2 = """
PawStack removes it automatically. Because the compiler can see the whole
program, it knows the exact set of capabilities that program uses. Everything
else is dead weight, and dead weight does not get linked. You write
application code and you get an operating system.
"""

[pawstack.how]
title = "How the compiler decides what ships"
body = """
Appa builds a capability set while lowering Gata to its IR. Each language
feature and standard-library call maps to the kernel subsystems it requires,
so the set grows as the program is analysed rather than being declared by
hand.
"""

[[pawstack.how.steps]]
step  = "01"
title = "Parse and type-check"
desc  = "Gata source becomes a typed AST. Static typing is what makes the rest of this possible, because the compiler knows what every call resolves to."

[[pawstack.how.steps]]
step  = "02"
title = "Collect capabilities"
desc  = "Lowering to IR records which kernel services each construct needs. Heap use marks the allocator, threading marks the scheduler, a draw call marks the display driver."

[[pawstack.how.steps]]
step  = "03"
title = "Configure the kernel"
desc  = "The capability set selects GatOS modules. Anything unreferenced is never compiled in, so it costs nothing in size or boot time."

[[pawstack.how.steps]]
step  = "04"
title = "Emit C, then an ISO"
desc  = "The backend emits C, links it against the configured kernel, and produces a bootable image. Two commands from source to something QEMU will boot."

[pawstack.components]
title = "The three pieces"
sub   = "Each is a standalone repository, and each is usable on its own."

[[pawstack.components.pieces]]
name = "GatOS"
repo = "GatOS"
role = "The backbone"
meta = "C · freestanding · x86_64"
desc = """
A cleanly designed modular kernel. It manages memory, schedules threads, runs
code in userspace, drives the display and supports USB devices. Every
subsystem is a module the toolchain can include or leave out, which is what
makes the whole idea work. CI builds it on Linux, Windows and macOS.
"""

[[pawstack.components.pieces]]
name = "Gata"
repo = "Gata"
role = "The frontend"
meta = "Language design · 24-module stdlib"
desc = """
A statically-typed, object-oriented systems language. Static types are not
decoration here. Whole-program type information is what lets the compiler
prove which kernel features a program can and cannot reach.
"""

[[pawstack.components.pieces]]
name = "Appa"
repo = "Appa"
role = "The orchestration layer"
meta = "C# · .NET 10 AOT"
desc = """
A real compiler: frontend, intermediate representation and backend. It emits C
rather than machine code, which keeps the toolchain portable and lets the
system C compiler do the final optimisation, then drives the kernel build and
produces the ISO.
"""

[pawstack.close]
title = "Try it"
body = """
Everything is open source and builds in two commands. GatOS has the fullest
documentation if you only want to read one repository.
"""
primary_label = "GatOS on GitHub"
primary_href  = "https://github.com/ApparentlyPlus/GatOS"
ghost_label   = "Back home"
ghost_href    = "/"

# Security Page (/security)

[security]
page_title = "Security"
eyebrow = "Competition · disclosure · challenge authoring"
title   = "Security"
tagline = "Before I started building things, I spent a while <em>breaking them</em>."
lede = """
It started with WannaCry in 2017 and a stack of books, turned into competing
for Greece a few years later, and left me with the habit I still use every day:
reading code for what the author assumed rather than for what they actually
wrote.
"""

[[security.stats]]
label = "Playing since"
value = "2017"

[[security.stats]]
label = "ECSC, Europe"
value = "11th"

[[security.stats]]
label = "HTB University CTF"
value = "10 of 955"

[[security.stats]]
label = "MadMath rating"
value = "4.9 / 5"

[security.start]
title = "Where it started"

paras = [
"""
WannaCry, 2017. I was twelve. What caught me was not the malware so much as how
little it took to knock over hospitals and rail networks in a single afternoon.
I wanted to know how something that small breaks something that large, and then
almost immediately I wanted to know how you stop it.
""",
"""
I spent a while as a script kiddie, the way everyone does at the start. What
got me out of it was a physical copy of Kali Linux Revealed, which happened to
come out that same year, read front to back. Johnny Long's foreword opens with
"You have no idea how good you have it," and he is right. I was born in 2005. I
never had to write my own scanner to sweep a class A network and burn the
results to a CD the way Jim Chapple did. I never waited on a Linux kernel to
reach me on a disc passed hand to hand, or dug through BugTraq and AstaLaVista
back when search engines were no help. Someone had already put all of it into
one operating system for me, and I have never stopped being impressed by that.
""",
"""
Nmap Network Scanning came next. Reading Fyodor explain, in his own words, how
the tool he wrote actually works is still the closest thing to an
apprenticeship I have had. None of it was applied to anything real for years. I
was a kid with books. But it is where the rest of this came from.
""",
]

[security.record]
title = "The record"
body = """
Then it stopped being theoretical, in roughly this order.
"""

[[security.record.steps]]
step  = "2023"
title = "PMDK, 2nd nationwide"
desc  = "A teacher asked whether I wanted to enter a competition run by the University of Piraeus. It was the year of my Panhellenic exams, so I agreed on one condition: strictly for fun, no preparation, no afternoons spent learning Coppersmith to break RSA with lattices. My schoolmates and I took 2nd. The team that beat us was effectively one person, going by saspect, who had dropped out of our own school the year before. We would have won with him."
link = "https://github.com/UniPiSSL/pmdk-2023"
link_label = "The competition"

[[security.record.steps]]
step  = "2023"
title = "ECSC national qualifiers, 3rd"
desc  = "PMDK got me into the national team's Discord, which is how I found out the qualifiers existed at all. I placed 3rd in the junior bracket. It would have been 2nd, but feasto took it back in the last few minutes."
link = "https://ctf.hackthebox.com/event/details/htb-x-ecsc-2023-greek-qualifiers-juniors-946"
link_label = "The qualifier"

[[security.record.steps]]
step  = "2023"
title = "ECSC, Team Greece, 11th in Europe"
desc  = "Came out of the bootcamp on the final team and competed in Hamar, Norway, where Greece finished 11th of 28 nations at the European Cyber Security Challenge."
link = "https://ecsc.gr/index.php/en/team-greece-2023-en/"
link_label = "The team"

[[security.record.steps]]
step  = "Dec 2023"
