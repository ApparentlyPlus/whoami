{% extends "base.html" %}
{% block title %}{{ c.not_found.page_title }}{% endblock %}
{% block content %}
<div class="error-wrap">
    <div class="error-code">4<span class="accent">0</span>4</div>
    <p class="error-msg">{{ c.not_found.message }}</p>
    <p class="error-sub">{{ c.not_found.sub }}</p>
    <a href="/" class="btn btn-primary error-back">{{ c.not_found.back }}</a>
</div>
{% endblock %}
