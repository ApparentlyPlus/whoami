<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{% block title %}whoareyou.sh{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/favicon/favicon-96x96.png') }}" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='assets/favicon/favicon.svg') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='assets/favicon/favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='assets/favicon/apple-touch-icon.png') }}">
    <meta name="apple-mobile-web-app-title" content="whoareyou">
    <link rel="manifest" href="{{ url_for('static', filename='assets/favicon/site.webmanifest') }}">

</head>
<body class="{% block body_class %}{% endblock %}">

<!-- Particles animation -->
<div id="particles-js"></div>

<!-- Overlay -->
<div class="overlay" id="page-overlay"></div>

<header class="site-header">

    <!-- Left: icon + text -->
    <div class="header-left">
        <img src="{{ url_for('static', filename='assets/favicon/logo.svg') }}" alt="icon" class="header-icon">
        <span class="header-wb-text">./whoareyou.sh</span>
    </div>

    <!-- Center: logo/title -->
    <div class="logo">{% block logo_text %}ApparentlyPlus [v20.0]{% endblock %}</div>

    <!-- Right: menu toggle -->
    <button class="menu-toggle" id="menu-toggle-btn" aria-label="Toggle navigation" aria-expanded="false">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
    </button>

    <nav class="main-menu-container" id="main-menu">
        <div class="main-menu">
            <h3 class="menu-title">Navigation</h3>
            <a href="/">Home</a>
            <a href="/projects">Projects</a>
            <a href="/accolades">Accolades</a>
            <a href="/resume">Resume</a>
        </div>
    </nav>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer-bottom">
    <div class="footer-links">
        <a href="mailto:apparentlyplus@gmail.com" class="footer-link-item">Email</a>
        <span class="footer-separator">|</span>
        <a href="https://github.com/ApparentlyPlus" target="_blank" rel="noopener noreferrer" class="footer-link-item">GitHub</a>
        <span class="footer-separator">|</span>
        <a href="https://www.linkedin.com/in/panagiotischatzikallias/" target="_blank" rel="noopener noreferrer" class="footer-link-item">LinkedIn</a>
    </div>
</footer>

<!-- particles.js library -->
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}" defer></script>

</body>
</html>
