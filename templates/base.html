<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}whoami{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- This is the container for the particle animation -->
<div id="particles-js"></div>

<header class="site-header">
<!-- ... existing header code ... -->
    <div class="logo">apparently_plus</div>
    
    <!-- Hamburger Menu Button -->
    <button class="menu-toggle" id="menu-toggle-btn" aria-label="Toggle navigation" aria-expanded="false">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
    </button>

    <!-- Menu links - now in a container -->
    <nav class="main-menu-container" id="main-menu">
        <div class="main-menu">
            <a href="/">Home</a>
            <a href="/projects">Projects</a>
            <a href="/blog">Blog</a>
            <a href="/resume">Resume</a>
        </div>
    </nav>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<!-- particles.js library -->
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<!-- Your existing script (which will also load the particle config) -->
<script src="{{ url_for('static', filename='js/main.js') }}" defer></script>

</body>
</html>
