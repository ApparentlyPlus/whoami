<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}whoami{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Particles animation -->
<div id="particles-js"></div>

<!-- Overlay -->
<div class="overlay" id="page-overlay"></div>

<header class="site-header">
    <div class="logo">apparently_plus</div>
    
    <button class="menu-toggle" id="menu-toggle-btn" aria-label="Toggle navigation" aria-expanded="false">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
    </button>

    <nav class="main-menu-container" id="main-menu">
        <div class="main-menu">
            <a href="/">Home</a>
            <a href="/projects">Projects</a>
            <a href="/blog">Blog</a>
            <a href="/resume">Resume</a>
        </div>
    </nav>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer-bottom">
    <div class="footer-links">
        <a href="mailto:your-email@example.com" class="footer-link-item">Email</a>
        <span class="footer-separator">|</span>
        <a href="https://github.com/ApparentlyPlus" target="_blank" rel="noopener noreferrer" class="footer-link-item">GitHub</a>
        <span class="footer-separator">|</span>
        <a href="https://linkedin.com/in/your-profile" target="_blank" rel="noopener noreferrer" class="footer-link-item">LinkedIn</a>
    </div>
</footer>

<!-- particles.js library -->
<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}" defer></script>

</body>
</html>
